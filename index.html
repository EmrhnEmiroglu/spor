    <script>
      // Çevrimdışı çalışma: yalnızca yayınlanmış (https) sürümde etkinleşir.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.search.indexOf('sw=1') !== -1)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('sw.js')
            .then(function () {
              return navigator.serviceWorker.ready;
            })
            .then(function () {
              // İlk açılışta indirilen dosyaları önbelleğe al ki bir sonraki açılış internetsiz çalışsın.
              var urls = [location.href.split('#')[0]];
              document.querySelectorAll('script[src], link[rel="manifest"], link[rel="apple-touch-icon"], link[rel="icon"]').forEach(function (el) {
                urls.push(el.src || el.href);
              });
              return caches.open('spor-v1').then(function (cache) {
                return Promise.all(
                  urls.map(function (u) {
                    return cache.add(u).catch(function () {});
                  })
                ).then(function () {
                  // Eski sürümlerin kod dosyalarını temizle.
                  return cache.keys().then(function (keys) {
                    keys.forEach(function (req) {
                      if (req.url.indexOf('/_expo/static/') !== -1 && urls.indexOf(req.url) === -1) cache.delete(req);
                    });
                  });
                });
              });
            })
            .catch(function () {});
        });
      }
    </script>
